[package]
name = "swarm-rider"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Ride a swarm of coding agents on your own machine"
repository = "https://github.com/emostov/rider"
readme = "README.md"
keywords = ["agents", "swarm", "cli", "git", "worktree"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "prompts/*.md",
    "src/**/*.rs",
    "LICENSE",
    "README.md",
]

[lib]
name = "rider"
path = "src/lib.rs"

[[bin]]
name = "rider"
path = "src/main.rs"

# A stand-in agent for the harness tests; it is not part of rider.
[[bin]]
name = "fake_agent"
path = "tests/bin/fake_agent.rs"

[dependencies]
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
jiff = { version = "1.0.1", default-features = false, features = ["std"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group"] }
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = "1"
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }

[dev-dependencies]
fastrand = "2"
tempfile = { version = "3.27.0", default-features = false }
